<!-- Skeuomorphic Edition for Mobile -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QuantTrader Pro - Skeuomorphic Mobile Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f1013 radial-gradient(#1e2128 15%, transparent 16%) 0 0 / 16px 16px;
    color: #e2e8f0;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 24px) 16px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .digital { font-family: 'Orbitron', monospace; letter-spacing: 1px; }

  .panel {
    background: linear-gradient(180deg, #252831 0%, #171920 100%);
    border-radius: 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.22);
    border-bottom: 2px solid #090a0d;
    box-shadow: 0 12px 30px -5px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,255,255,0.15), inset 0 -2px 4px rgba(0,0,0,0.6);
    padding: 18px;
    margin-bottom: 16px;
    position: relative;
  }
  .debossed {
    background: #0b0d11;
    border-radius: 14px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), inset 0 -1px 2px rgba(255,255,255,0.1), 0 1px 0 rgba(255,255,255,0.08);
    border: 1px solid #1f232d;
    padding: 12px 14px;
  }
  .btn-tactile {
    background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 3px solid #111827;
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
  }
  .btn-tactile.active {
    background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
    border-top: 1px solid rgba(254, 243, 199, 0.6);
    border-bottom: 3px solid #78350f;
  }
  .led {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.6);
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
  }
  .led-green { background: radial-gradient(circle at 35% 35%, #86efac, #10b981); }
  .led-amber { background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b); box-shadow: 0 0 10px rgba(245, 158, 11, 0.8); }
</style>
</head>
<body>
  <div style="max-width: 600px; margin: 0 auto;">
    <div class="panel" style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(180deg, #f59e0b, #b45309); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #111; font-size: 18px; border-top: 1px solid #fef3c7;">Au</div>
        <div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <h2 style="font-size: 18px; font-weight: 900;">XAUUSDb</h2>
            <div class="led led-green"></div>
          </div>
          <div style="font-size: 11px; color: #94a3b8;">HFM Live17 • Spread $0.22</div>
        </div>
      </div>
      <div class="debossed" style="text-align: right;">
        <div style="font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">Gold Bid</div>
        <div class="digital" style="font-size: 18px; color: #f59e0b; font-weight: 900;" id="bid-val">3,987.90</div>
      </div>
    </div>

    <!-- METRICS -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;">
      <div class="panel" style="padding: 12px; margin: 0;">
        <div style="font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">Balance Vault</div>
        <div class="debossed" style="margin-top: 6px; text-align: center;">
          <div class="digital" style="font-size: 18px; color: #10b981; font-weight: 900;">$72.95</div>
        </div>
      </div>
      <div class="panel" style="padding: 12px; margin: 0;">
        <div style="font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">Equity Meter</div>
        <div class="debossed" style="margin-top: 6px; text-align: center;">
          <div class="digital" style="font-size: 18px; color: #fff; font-weight: 900;">$72.95</div>
        </div>
      </div>
    </div>

    <!-- REGIMES -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="font-size: 12px; font-weight: 900; text-transform: uppercase;">Tactile Execution Deck</div>
        <button id="btn-master" onclick="toggleMaster()" style="padding: 6px 12px; border-radius: 10px; background: #10b981; color: #020617; font-weight: 900; font-size: 11px; border: none; cursor: pointer;">ARMED</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="btn-tactile active" onclick="setSkMode('AGGRESSIVE', this)">
          <div style="font-size: 10px; font-weight: 900; color: #fde68a;">⚡ AGGRESSIVE</div>
          <div class="digital" style="font-size: 13px; font-weight: 700; margin-top: 2px;">+$14.00 TP</div>
        </div>
        <div class="btn-tactile" onclick="setSkMode('NORMAL', this)">
          <div style="font-size: 10px; font-weight: 900; color: #94a3b8;">🛡️ NORMAL</div>
          <div class="digital" style="font-size: 13px; font-weight: 700; margin-top: 2px;">+$7.00 TP</div>
        </div>
      </div>
    </div>

    <!-- SHIELDS -->
    <div class="panel">
      <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px;">Physical Safety Matrix</div>
      <div class="debossed" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 11px; font-weight: 700;">🛡️ Strategy Alpha Dual-EMA</span>
        <div class="led led-green"></div>
      </div>
      <div class="debossed" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-size: 11px; font-weight: 700;">🛑 H1 Loophole Guard</span>
        <div class="led led-green"></div>
      </div>
      <div class="debossed" style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; font-weight: 700;">⏱️ Session Liquidity Buffer</span>
        <div class="led led-green"></div>
      </div>
    </div>
  </div>
  <script>
    let armed = true;
    function toggleMaster() {
      armed = !armed;
      const b = document.getElementById('btn-master');
      b.style.background = armed ? '#10b981' : '#f43f5e';
      b.innerText = armed ? 'ARMED' : 'PAUSED';
    }
    function setSkMode(m, el) {
      document.querySelectorAll('.btn-tactile').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
    setInterval(() => {
      document.getElementById('bid-val').innerText = (3987.90 + (Math.random()*0.3 - 0.15)).toFixed(2);
    }, 1500);
  </script>
</body>
</html>
